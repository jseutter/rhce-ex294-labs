---
- name: deploy to dev
  hosts: webservers
  become: true
  tasks:
    - name: install httpd
      ansible.builtin.dnf:
        name: httpd
        state: latest

    - name: start httpd on boot
      ansible.builtin.systemd:
        name: httpd
        state: started
        enabled: true

    - name: httpd vhost.conf
      ansible.builtin.template:
        src: templates/vhost.conf.j2
        dest: /etc/httpd/conf.d/vhost.conf
      notify: Restart httpd

    - name: "Make /var/www/vhosts/{{ ansible_facts['hostname'] }}"
      ansible.builtin.file:
        path: "/var/www/vhosts/{{ ansible_facts['hostname'] }}"
        state: directory
        seuser: system_u
        serole: object_r
        setype: httpd_sys_content_t

    - name: Deploy index.html
      ansible.builtin.copy:
        src: files/index.html
        dest: "/var/www/vhosts/{{ ansible_facts['hostname'] }}"
        seuser: system_u
        serole: object_r
        setype: httpd_sys_content_t
        

    - name: Open firewall port 80
      ansible.posix.firewalld:
        service: http
        permanent: yes
        immediate: yes
        state: enabled


  handlers:
    - name: Restart httpd
      ansible.builtin.systemd:
        name: httpd
        state: restarted

